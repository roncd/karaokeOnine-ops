#Services front/back/db
services:
  frontend:
    image: ghcr.io/${GITHUB}/karaoke-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${PORT_FRONT:-80}:80"
    environment:
      - API_URL=http://backend:${PORT_BACK:-3000}
    depends_on:
      - backend

  backend:
    image: ghcr.io/${GITHUB}/karaoke-backend:${IMAGE_TAG:-latest}
    ports:
      - "${PORT_BACK:-3000}:3000"
    environment:
      - NODE_ENV=${APP_ENV}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWD}@db:5432/${BD_NAME}
      - MAX_ROOM_SIZE=${MAX_ROOM_SIZE}
      - SKIP_VOTE_THRESHOLD_PERCENT=${SKIP_VOTE_THRESHOLD_PERCENT}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - BD_NAME=${BD_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWD=${DB_PASSWD}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: